<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AG Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AG HABIT TRACKER
   No database, no login: habits live in the embed URL, and
   checkbox state lives in this browser's localStorage. The grid
   clears itself automatically at the start of each new week,
   the same "no backend" philosophy as the rest of the AG suite.
   ============================================================ */
:root {
  color-scheme: light dark;

  /* CARD COLOR */
  --card-color: #FAF6EF;
  /* TEXT COLOR: habit names, day letters */
  --text-color: #2E2823;
  /* ACCENT COLOR: checked boxes, progress line */
  --accent-color: #8A7B69;

  /* CARD CORNER ROUNDNESS */
  --card-radius: 24px;

  /* TEXT SIZE multiplier, set by the ?size= parameter */
  --size-scale: 1;

  /* SHADOW: tight and dark, like a sticker sitting flat on the page */
  --shadow-tint: rgba(20,16,12,.46);
  --shadow-gap: 1.6vmin;

  /* FONTS */
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'Jost', 'Helvetica Neue', sans-serif;
  --font-title: var(--font-serif);
  --font-habit: var(--font-sans);
}
/* ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  padding: var(--shadow-gap);
}

.card {
  width: 100%;
  height: 100%;
  background: var(--card-color);
  border-radius: var(--card-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: clamp(20px, 5.5vmin, 40px) clamp(22px, 6vmin, 44px);
  box-shadow:
    0 .5vmin 1.3vmin -.6vmin var(--shadow-tint),
    0 .12vmin .35vmin rgba(20,16,12,.3);
}
.card.flat { box-shadow: none; }

.title {
  font-family: var(--font-title);
  font-weight: 600;
  font-size: calc(clamp(16px, 4.6vmin, 28px) * var(--size-scale));
  color: var(--text-color);
  margin-bottom: 1.8vmin;
  flex-shrink: 0;
}

.progress-wrap {
  flex-shrink: 0;
  margin-bottom: 3vmin;
}

.progress-track {
  width: 100%;
  height: 4px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--accent-color) 22%, transparent);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent-color);
  border-radius: 4px;
  transition: width .25s ease;
}

.grid-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: auto;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(7, auto) auto;
  align-items: center;
  column-gap: 1.6vmin;
  padding: 1.1vmin 0;
}

.head-row {
  padding-bottom: 1.4vmin;
  border-bottom: 1px solid color-mix(in srgb, var(--text-color) 16%, transparent);
  margin-bottom: 0.6vmin;
}

.habit-name {
  font-family: var(--font-habit);
  font-weight: 400;
  font-size: calc(clamp(11px, 2.9vmin, 15px) * var(--size-scale));
  color: var(--text-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.day-label {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: calc(clamp(8px, 2vmin, 11px) * var(--size-scale));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-color);
  text-align: center;
  width: clamp(16px, 4vmin, 26px);
  height: clamp(16px, 4vmin, 26px);
  box-sizing: border-box;
  border-radius: 50%;
  border: 1.2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}

.day-label.today {
  border-color: var(--accent-color);
}

.box {
  width: clamp(16px, 4vmin, 26px);
  height: clamp(16px, 4vmin, 26px);
  border-radius: 30%;
  border: 1.5px solid color-mix(in srgb, var(--text-color) 32%, transparent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease, border-color .12s ease, transform .08s ease;
  background: transparent;
}

.box:hover { transform: scale(1.08); }

.box.checked {
  background: var(--accent-color);
  border-color: var(--accent-color);
}

.box svg {
  width: 62%;
  height: 62%;
  fill: none;
  stroke: var(--card-color);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: scale(.6);
  transition: opacity .1s ease, transform .1s ease;
}

.box.checked svg {
  opacity: 1;
  transform: scale(1);
}

.plant-cell {
  width: clamp(26px, 6vmin, 40px);
  height: clamp(30px, 6.6vmin, 44px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-left: 0.6vmin;
}

.plant-cell svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.plant-cell path {
  transition: opacity .2s ease;
}

.head-plant-icon {
  width: clamp(26px, 6vmin, 40px);
  height: clamp(16px, 4vmin, 26px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-state {
  font-family: var(--font-sans);
  font-size: calc(14px * var(--size-scale));
  color: var(--accent-color);
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="title" id="titleEl"></div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  <div class="grid-wrap" id="gridWrap"></div>
</div>

<script>
/* ============================================================
   URL PARAMETERS
   ?habits=   pipe-separated habit names, e.g. Drink+Water|Read|Move
   ?start=    week start day: "sunday" or "monday" (default monday)
   ?title=    heading text (default "This Week")
   ?card=     card color, hex without #
   ?text=     habit name / heading color, hex without #
   ?accent=   checked box + day letter color, hex without #
   ?radius=   card corner roundness in px
   ?size=     text size as a percentage, 50 to 250 (default 100)
   ?shadow=false   hide the drop shadow
   ?titleFont=  Google Font name for the title, e.g. "Playfair+Display"
   ?habitFont=  Google Font name for habit names, e.g. "Jost"
   ?id=       optional instance id, only needed if you embed two
              trackers with the identical habit list side by side
   ============================================================ */
const params = new URLSearchParams(window.location.search);
const root = document.documentElement.style;
const hex = v => /^[0-9a-fA-F]{3,8}$/.test(v) ? '#' + v : null;

/* Weight strings for each curated font, so only what's needed loads */
const FONT_WEIGHTS = {
  'Cormorant Garamond': 'wght@500;600',
  'Playfair Display': 'wght@500;600',
  'Lora': 'wght@400;500;600',
  'Libre Baskerville': 'wght@400;700',
  'EB Garamond': 'wght@400;500;600',
  'Cormorant': 'wght@500;600',
  'Jost': 'wght@300;400;500',
  'Montserrat': 'wght@400;500;600',
  'Inter': 'wght@400;500;600',
  'Poppins': 'wght@400;500;600',
  'Caveat': 'wght@500;600',
  'Dancing Script': 'wght@500;600'
};

function loadGoogleFont(name) {
  if (!name || !FONT_WEIGHTS[name]) return;
  const id = 'gf-' + name.replace(/\s+/g, '-');
  if (document.getElementById(id)) return;
  const link = document.createElement('link');
  link.id = id;
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/\s+/g, '+') + ':' + FONT_WEIGHTS[name] + '&display=swap';
  document.head.appendChild(link);
}

const titleFontParam = params.get('titleFont');
if (titleFontParam) {
  const name = titleFontParam.replace(/\+/g, ' ');
  loadGoogleFont(name);
  root.setProperty('--font-title', `'${name}', ` + (['Caveat','Dancing Script'].includes(name) ? 'cursive' : 'serif'));
}

const habitFontParam = params.get('habitFont');
if (habitFontParam) {
  const name = habitFontParam.replace(/\+/g, ' ');
  loadGoogleFont(name);
  root.setProperty('--font-habit', `'${name}', ` + (['Caveat','Dancing Script'].includes(name) ? 'cursive' : 'sans-serif'));
}

['card','text','accent'].forEach(key => {
  const val = params.get(key);
  if (val) {
    const c = hex(val);
    if (c) root.setProperty('--' + key + '-color', c);
  }
});

const radiusParam = params.get('radius');
if (radiusParam !== null) {
  root.setProperty('--card-radius', /^\d+$/.test(radiusParam) ? radiusParam + 'px' : radiusParam);
}

const sizeParam = params.get('size');
if (sizeParam !== null && !isNaN(parseFloat(sizeParam))) {
  root.setProperty('--size-scale', (parseFloat(sizeParam) / 100).toString());
}

if (params.get('shadow') === 'false') {
  document.getElementById('card').classList.add('flat');
}

document.getElementById('titleEl').textContent = params.get('title') || 'This Week';

const startDay = (params.get('start') || 'monday').toLowerCase() === 'sunday' ? 0 : 1;

const habits = (params.get('habits') || '')
  .split('|')
  .map(h => h.trim())
  .filter(Boolean);

/* ---------- week math ---------- */
// Day letters ordered from the chosen start day
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const orderedDayIdx = [];
for (let i = 0; i < 7; i++) orderedDayIdx.push((startDay + i) % 7);

function weekKeyFor(date) {
  // Find the most recent occurrence of startDay, at or before `date`
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const diff = (d.getDay() - startDay + 7) % 7;
  d.setDate(d.getDate() - diff);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const today = new Date();
const currentWeekKey = weekKeyFor(today);
const todayDayIdx = today.getDay();

/* ---------- storage ---------- */
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h).toString(36);
}
const instanceId = params.get('id') || hashStr(
  habits.join('|') + '::' + startDay + '::' +
  (params.get('title') || '') + '::' +
  (params.get('card') || '') + '::' +
  (params.get('text') || '') + '::' +
  (params.get('accent') || '')
);
const storageKey = 'ag-habit-tracker-' + instanceId;

let state;
try {
  const raw = localStorage.getItem(storageKey);
  state = raw ? JSON.parse(raw) : null;
} catch (e) {
  state = null;
}

if (!state || state.weekKey !== currentWeekKey) {
  state = { weekKey: currentWeekKey, checks: {} };
  saveState();
}

function saveState() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (e) { /* storage unavailable, tracking just won't persist */ }
}

/* ---------- render ---------- */
const gridWrap = document.getElementById('gridWrap');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');

function updateProgress() {
  const total = habits.length * 7;
  if (!total) { progressWrap.style.display = 'none'; return; }
  const done = Object.values(state.checks).filter(Boolean).length;
  progressFill.style.width = Math.min(100, (done / total) * 100) + '%';
}

/* ---------- growing plant, one per row ---------- */
const PLANT_ANGLES = [-70, -46, -23, 0, 23, 46, 70];
const PLANT_LENGTHS = PLANT_ANGLES.map((a, i) => 9 + (3 - Math.abs(i - 3)) * 1.3);

function leafPath(angleDeg, length) {
  const rad = angleDeg * Math.PI / 180;
  const x2 = 16 + length * Math.sin(rad);
  const y2 = 25 - length * Math.cos(rad);
  const curveKick = angleDeg < 0 ? -2.2 : (angleDeg > 0 ? 2.2 : 0);
  const cx = 16 + (length * 0.55) * Math.sin(rad) + curveKick;
  const cy = 25 - (length * 0.55) * Math.cos(rad);
  return `M16,25 Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}

function plantSVG(count) {
  let leaves = '';
  for (let i = 0; i < 7; i++) {
    const visible = i < count;
    leaves += `<path d="${leafPath(PLANT_ANGLES[i], PLANT_LENGTHS[i])}" stroke="var(--accent-color)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="${visible ? 1 : 0}"/>`;
  }
  const budRadius = count >= 7 ? 3 : 1.6;
  const budOpacity = count > 0 ? 1 : 0.35;
  return `<svg viewBox="0 0 32 30" xmlns="http://www.w3.org/2000/svg">
    <line x1="8" y1="27.5" x2="24" y2="27.5" stroke="var(--accent-color)" stroke-width="1" opacity="0.25"/>
    ${leaves}
    <circle cx="16" cy="25" r="${budRadius}" fill="var(--accent-color)" opacity="${budOpacity}"/>
  </svg>`;
}

function rowCheckedCount(hIdx) {
  return orderedDayIdx.reduce((n, di) => n + (state.checks[hIdx + '-' + di] ? 1 : 0), 0);
}

if (!habits.length) {
  gridWrap.innerHTML = '<div class="empty-state">Add habits in the customizer to see them here.</div>';
  progressWrap.style.display = 'none';
} else {
  const headRow = document.createElement('div');
  headRow.className = 'row head-row';
  const headSpacer = document.createElement('div');
  headRow.appendChild(headSpacer);
  orderedDayIdx.forEach(di => {
    const lbl = document.createElement('div');
    lbl.className = 'day-label' + (di === todayDayIdx ? ' today' : '');
    lbl.textContent = DAY_NAMES[di][0];
    headRow.appendChild(lbl);
  });
  const headPlantSpacer = document.createElement('div');
  headPlantSpacer.className = 'head-plant-icon';
  headRow.appendChild(headPlantSpacer);
  gridWrap.appendChild(headRow);

  habits.forEach((habitName, hIdx) => {
    const row = document.createElement('div');
    row.className = 'row';

    const name = document.createElement('div');
    name.className = 'habit-name';
    name.textContent = habitName;
    row.appendChild(name);

    const plantCell = document.createElement('div');
    plantCell.className = 'plant-cell';
    plantCell.innerHTML = plantSVG(rowCheckedCount(hIdx));

    orderedDayIdx.forEach(di => {
      const key = hIdx + '-' + di;
      const box = document.createElement('div');
      box.className = 'box' + (state.checks[key] ? ' checked' : '');
      box.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';
      box.addEventListener('click', () => {
        state.checks[key] = !state.checks[key];
        box.classList.toggle('checked', !!state.checks[key]);
        saveState();
        updateProgress();
        plantCell.innerHTML = plantSVG(rowCheckedCount(hIdx));
      });
      row.appendChild(box);
    });

    row.appendChild(plantCell);
    gridWrap.appendChild(row);
  });

  updateProgress();
}
</script>
</body>
</html>
